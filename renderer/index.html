<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>桌面工作台</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </div>
      <div class="bt">
        <div class="t">桌面工作台</div>
        <div class="s">DESKTOP WORKBENCH</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="row"><span id="ver"></span><span class="qt" id="quitBtn">退出</span></div>
    </div>
  </aside>

  <div class="content">
    <div class="titlebar" id="titlebar">
      <div class="drag" id="tbDrag">
        <div class="tb-logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </div>
        <div class="tb-name">桌面工作台</div>
      </div>
    </div>
    <div class="winctl" id="winctl">
      <button id="searchBtn" title="全局搜索 (Ctrl+K)"></button>
      <button id="layoutBtn" title="窗口化 / 覆盖桌面"></button>
      <button id="pinBtn" title="置顶显示"></button>
      <button id="hideBtn" title="隐藏到系统托盘"></button>
      <button id="minBtn" title="最小化"></button>
      <button id="maxBtn" title="最大化 / 还原"></button>
      <button id="closeBtn" class="danger" title="退出"></button>
    </div>
    <div class="main"><div class="view" id="view"></div></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toasts"></div>

<!-- 脚本按依赖顺序普通加载（无构建步骤）。顶层声明在同一页面的全局作用域内跨文件
     共享：function 声明挂到全局对象，const/let 进入全局词法环境，且必须在本文件
     之后才能被其他文件读取 —— 所以顺序不能随意调整。
     拆分说明与校验：tools/refactor/split-app.js、tools/refactor/verify-decls.js、
     test/contract.test.js -->
<script src="storeproto.js"></script>
<!-- errortrap 必须紧跟其后：错误兜底不能依赖任何可能挂掉的脚本 -->
<script src="errortrap.js"></script>
<script src="dateutil.js"></script>
<script src="importguard.js"></script>
<script src="core.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
<script src="view-dashboard.js"></script>
<script src="view-shortcuts.js"></script>
<script src="view-files.js"></script>
<script src="view-todos.js"></script>
<script src="view-calendar.js"></script>
<script src="view-notes.js"></script>
<script src="view-checkins.js"></script>
<script src="view-stats.js"></script>
<script src="view-usage.js"></script>
<script src="view-pomodoro.js"></script>
<script src="view-settings.js"></script>
<script src="diagnostics.js"></script>
<script src="dialogs.js"></script>
<script src="search.js"></script>
<script src="actions.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body>
</html>
